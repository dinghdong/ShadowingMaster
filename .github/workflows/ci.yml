name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vite 8 与 oxlint 都要求 ^20.19.0 || >=22.12.0。此前写 "20"（解析为 20.x
          # 最新版）只是勉强踩线，Node 20 进入维护期后随时可能低于 20.19 而失败。
          # 与 frontend/package.json 的 engines 保持一致。
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint        # oxlint
      - run: npm run build        # tsc -b && vite build

  backend:
    # 仅在 PR 上校验 Dockerfile 可构建。push 到 main 时 deploy.yml 会做真正的
    # 构建并推送 GHCR，这里再构建一次纯属重复，白占几分钟 runner。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t shadowingmaster-backend:ci ./backend

  backend-import:
    # 冒烟：镜像之外再单独校验后端模块可导入。Dockerfile 只做 pip install，
    # 不会执行应用代码，语法错误 / 循环导入要到容器起来才暴露 —— 那时已经在生产了。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"     # 与 backend/Dockerfile 的基础镜像一致
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -c "import main, import_video, fetch_video, backfill_word_timings"
