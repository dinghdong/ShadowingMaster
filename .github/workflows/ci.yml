name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vite 8 与 oxlint 都要求 ^20.19.0 || >=22.12.0。此前写 "20"（解析为 20.x
          # 最新版）只是勉强踩线，Node 20 进入维护期后随时可能低于 20.19 而失败。
          # 与 frontend/package.json 的 engines 保持一致。
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint        # oxlint
      - run: npm run build        # tsc -b && vite build

  backend-import:
    # 冒烟：单独校验后端模块可导入。生产是 systemd 直跑（不构建镜像），语法错误 /
    # 循环导入要在这里尽早暴露，而不是等到 deploy 重启服务后才在线上崩。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"     # 与 backend/Dockerfile 的基础镜像一致
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -c "import main, import_video, fetch_video, backfill_word_timings"
