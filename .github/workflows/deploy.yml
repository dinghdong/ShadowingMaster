name: Deploy backend

# 触发：push 到 main。前端由 Vercel git 集成独立部署（见 README「部署」）。
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 推送到 GHCR 需要写包权限
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR 拒绝含大写字母的镜像名（invalid reference format: repository name must
      # be lowercase）。本仓库是 dinghdong/ShadowingMaster，直接用 github.repository
      # 会在 push 阶段失败，故先转成小写。
      - name: Resolve image name
        id: img
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 同时打 latest 与 sha-<commit>：latest 供日常拉取，sha 标签是不可变引用，
      # 出问题时可直接把 .env 里的 BACKEND_IMAGE 指到上一个已知良好的 sha 回滚，
      # 不必重新构建（此前只有 latest，回滚需手动找 digest）。
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.repo }}/backend:latest
            ghcr.io/${{ steps.img.outputs.repo }}/backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render Caddyfile (inject domain)
        run: sed "s/DOMAIN/${{ secrets.DEPLOY_DOMAIN }}/g" Caddyfile > Caddyfile.rendered

      - name: Ship compose + Caddyfile to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile.rendered"
          target: "/opt/shadowingmaster"
          overwrite: true

      - name: Write env + roll out
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/shadowingmaster
            mv -f Caddyfile.rendered Caddyfile
            # 运行时 .env（来自仓库 Secrets.BACKEND_ENV）；不要在其中写 BACKEND_IMAGE
            printf '%s\n' "${{ secrets.BACKEND_ENV }}" > .env
            # 固定到本次构建的不可变 sha 标签，而非 latest：latest 会被下次构建覆盖，
            # 导致「重启一次容器就悄悄换了版本」。用 sha 标签则 compose 记录的就是
            # 确切版本，回滚只需把这一行改回上一个 sha 再 up -d。
            sed -i '/^BACKEND_IMAGE=/d' .env
            echo "BACKEND_IMAGE=ghcr.io/${{ steps.img.outputs.repo }}/backend:sha-${{ github.sha }}" >> .env
            docker compose pull backend
            docker compose up -d --remove-orphans
            # 先探容器内部，把「应用起不来」与「Caddy/DNS/证书没就绪」区分开 ——
            # 只探公网域名的话，两类故障会报成同一个错，定位要多花一轮。
            echo "waiting for backend container ..."
            for i in $(seq 1 12); do
              if docker compose exec -T backend python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')" 2>/dev/null; then
                echo "container OK"; break
              fi
              [ "$i" = "12" ] && { echo "BACKEND CONTAINER UNHEALTHY"; docker compose logs --tail=50 backend; exit 1; }
              sleep 5
            done
            echo "waiting for public /api/health ..."
            for i in $(seq 1 12); do
              if curl -fsS "https://${{ secrets.DEPLOY_DOMAIN }}/api/health"; then
                echo "DEPLOY OK"; exit 0
              fi
              sleep 5
            done
            echo "PUBLIC HEALTH CHECK FAILED (容器正常，问题在 Caddy/DNS/证书)"
            docker compose logs --tail=30 caddy
            exit 1
