name: Deploy backend

# 触发：push 到 main。前端由 Vercel git 集成独立部署（见 README「部署」）。
#
# 生产后端是 systemd 直跑（非容器）：单元 shadowing.service 在 /opt/shadowing/backend
# 用 venv 里的 uvicorn 起服务，Caddy 已在 /etc/caddy/Caddyfile 把
# api.shadowingmaster.genisource.studio 反代到 localhost:8000。服务器没装 git，
# 所以部署 = 把代码 rsync 过去 + systemctl restart，不是 git pull、也不是 Docker。
#
# 服务器上的 /opt/shadowing/backend/.env 已是真实配置，部署**保留它**，不覆盖
# （所以不再需要 BACKEND_ENV 这个 Secret）。Caddyfile 也已就位，部署不碰它。
on:
  push:
    branches: [main]
  # 手动触发：填一个 ref（commit sha / 分支 / tag）可部署或回滚到该版本；留空=当前 HEAD。
  workflow_dispatch:
    inputs:
      ref:
        description: "要部署的 git ref（留空=当前 HEAD；回滚填旧 commit sha）"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # push 时 github.ref 即 main；手动触发时可用 inputs.ref 指定回滚目标。
          ref: ${{ github.event.inputs.ref || github.ref }}

      # 四个 Secrets 缺任意一个，后面 rsync/ssh 会连到空主机或写不进文件。
      # 一次性点名，省一轮「部署为什么没生效」的排查。
      - name: Guard required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          miss=0
          for v in VPS_HOST VPS_USER VPS_SSH_KEY DEPLOY_DOMAIN; do
            [ -n "${!v}" ] || { echo "ERROR: Secrets.$v 未配置"; miss=1; }
          done
          [ "$miss" = 0 ] || { echo "请在 Settings → Secrets and variables → Actions 补齐后重跑"; exit 1; }
          echo "4 个 Secrets 均已配置"

      # 把部署私钥落到文件（不进仓库、不打印），用 accept-new 把主机指纹记入 known_hosts。
      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          command -v rsync || sudo apt-get update -y && sudo apt-get install -y rsync
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # 部署前先对线上 backend/ 与 packages/ 做时间戳备份（保留最近 3 份），并记录
      # 当前 requirements.txt 哈希，供后面判断要不要重装依赖。回滚时直接把备份 cp 回去即可。
      - name: Pre-deploy backup on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" '
            set -e
            ts=$(date +%Y%m%d-%H%M%S)
            cp -a /opt/shadowing/backend  /opt/shadowing/backup-$ts-backend
            cp -a /opt/shadowing/packages /opt/shadowing/backup-$ts-packages
            sha256sum /opt/shadowing/backend/requirements.txt 2>/dev/null | awk "{print \$1}" > /opt/shadowing/.deploy_req_hash_prev
            # 只留最近 3 份 backend 备份
            ls -dt /opt/shadowing/backup-*-backend 2>/dev/null | tail -n +4 | xargs -r rm -rf
            echo "backup snapshot: $ts"
          '

      # rsync 代码过去。**不加 --delete**：保留服务器上的 .env / media / app.db 等
      # 仓库外文件；只新增/更新仓库里的文件。排除项见各自 --exclude。
      - name: Sync code to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.env' --exclude='media' --exclude='__pycache__' \
            --exclude='*.pyc' --exclude='.cache' --exclude='*.db' --exclude='.git' \
            --exclude='venv' --exclude='app.db*' \
            backend/ "$VPS_USER@$VPS_HOST:/opt/shadowing/backend/"
          rsync -az -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='*.egg-info' --exclude='.git' \
            packages/ "$VPS_USER@$VPS_HOST:/opt/shadowing/packages/"

      # 落权、按需重装依赖、重启、本地健康检查（公网探活放下一步，在 runner 上做，
      # 以免 $DEPLOY_DOMAIN 这类 runner 侧变量泄漏不进远程 shell）。
      - name: Restart service + local health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" '
            set -e
            cd /opt/shadowing
            # 依赖变化才重装，避免每次部署都联网解析（服务器出口走代理，省一次是一次）
            NEW=$(sha256sum backend/requirements.txt 2>/dev/null | awk "{print \$1}")
            PREV=$(cat .deploy_req_hash_prev 2>/dev/null || echo none)
            if [ "$NEW" != "$PREV" ]; then
              echo ">> requirements.txt 有变化，重装依赖"
              venv/bin/pip install -r backend/requirements.txt
            else
              echo ">> requirements.txt 未变，跳过 pip install"
            fi
            chown -R shadowing:shadowing backend packages
            systemctl restart shadowing
            echo ">> 等待服务起来 ..."
            ok=0
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then ok=1; break; fi
              sleep 3
            done
            [ "$ok" = 1 ] || { echo "BACKEND UNHEALTHY"; journalctl -u shadowing --no-pager --tail=40; exit 1; }
            echo ">> 本地 /api/health OK"
          '

      # 公网全链路探活（Caddy/TLS/DNS），在 runner 上做。失败只 warning：
      # 本地已确认应用健康，公网不通通常是证书/解析问题，不该让部署判红。
      - name: Public health check (best-effort)
        env:
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://$DEPLOY_DOMAIN/api/health"; then
              echo "DEPLOY OK (public https://$DEPLOY_DOMAIN/api/health)"; exit 0
            fi
            sleep 3
          done
          echo "::warning:: 本地健康但公网探活失败（Caddy/DNS/证书问题，非代码问题）"
