<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-label="Logo comparison v4 vs v5 vs comet">
  <defs>
    <linearGradient id="warmTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB059"/>
      <stop offset="55%" stop-color="#FF7A2F"/>
      <stop offset="100%" stop-color="#EC551C"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#EC551C" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="tailGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- v4 shadow mic -->
  <g transform="translate(30,28)">
    <rect x="8" y="8" width="144" height="144" rx="38" fill="url(#warmTile)" filter="url(#soft)"/>
    <g opacity="0.24" fill="#FFFFFF">
      <rect x="70" y="42" width="38" height="54" rx="19"/>
      <path fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" d="M73 98 L73 108 Q73 113 78 113 L108 113 Q113 113 113 108 L113 98"/>
      <line x1="89" y1="113" x2="89" y2="129" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <line x1="75" y1="131" x2="103" y2="131" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="61" y="34" width="38" height="54" rx="19" fill="#FFFFFF"/>
      <g stroke="#EC551C" stroke-opacity="0.5" stroke-width="2.4" stroke-linecap="round">
        <line x1="68" y1="48" x2="92" y2="48"/>
        <line x1="68" y1="58" x2="92" y2="58"/>
        <line x1="68" y1="68" x2="92" y2="68"/>
      </g>
      <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
        <path d="M60 90 L60 100 Q60 105 65 105 L95 105 Q100 105 100 100 L100 90"/>
        <line x1="80" y1="105" x2="80" y2="121"/>
        <line x1="66" y1="123" x2="94" y2="123"/>
      </g>
    </g>
    <g fill="#FFFFFF">
      <circle cx="128" cy="30" r="3" opacity="0.9"/>
      <circle cx="139" cy="46" r="2" opacity="0.7"/>
    </g>
  </g>

  <!-- v5 echo bubble -->
  <g transform="translate(208,28)">
    <rect x="8" y="8" width="144" height="144" rx="38" fill="url(#warmTile)" filter="url(#soft)"/>
    <g opacity="0.22" fill="#FFFFFF" transform="translate(8,8)">
      <rect x="32" y="40" width="66" height="50" rx="18"/>
      <path d="M46 90 L46 106 L64 90 Z"/>
    </g>
    <g>
      <rect x="32" y="40" width="66" height="50" rx="18" fill="#FFFFFF"/>
      <path d="M46 90 L46 106 L64 90 Z" fill="#FFFFFF"/>
      <g fill="none" stroke="#FF7A2F" stroke-width="4.5" stroke-linecap="round">
        <path d="M52 58 A 12 12 0 0 1 52 72"/>
        <path d="M60 53 A 20 20 0 0 1 60 77"/>
        <path d="M68 48 A 28 28 0 0 1 68 82"/>
      </g>
    </g>
    <g fill="#FFFFFF">
      <circle cx="128" cy="30" r="3" opacity="0.9"/>
      <circle cx="139" cy="46" r="2" opacity="0.7"/>
    </g>
  </g>

  <!-- comet echo -->
  <g transform="translate(386,28)">
    <rect x="8" y="8" width="144" height="144" rx="38" fill="url(#warmTile)" filter="url(#soft)"/>
    <path d="M92 52 Q 64 80 38 106 Q 58 80 98 64 Z" fill="url(#tailGrad)"/>
    <g fill="#FFFFFF">
      <circle cx="80" cy="72" r="14" opacity="0.52"/>
      <circle cx="68" cy="84" r="10.5" opacity="0.37"/>
      <circle cx="57" cy="94" r="7.5" opacity="0.26"/>
      <circle cx="48" cy="102" r="5" opacity="0.16"/>
      <circle cx="41" cy="108" r="3" opacity="0.10"/>
    </g>
    <circle cx="94" cy="56" r="23" fill="#FFFFFF"/>
    <g fill="#FFFFFF">
      <circle cx="128" cy="30" r="3" opacity="0.9"/>
      <circle cx="139" cy="46" r="2" opacity="0.7"/>
    </g>
  </g>

  <text x="102" y="212" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">v4 · 影子话筒</text>
  <text x="280" y="212" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">v5 · 回声气泡</text>
  <text x="458" y="212" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">彗尾 · 紧跟</text>
  <text x="102" y="238" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#888">实体+影子话筒</text>
  <text x="280" y="238" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#888">对话气泡+声波</text>
  <text x="458" y="238" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#888">实心头+拖尾回声</text>
</svg>
