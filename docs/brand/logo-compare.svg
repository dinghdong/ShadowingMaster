<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" width="460" height="270" role="img" aria-label="ShadowingMaster logo comparison v3 vs v4">
  <defs>
    <linearGradient id="warmTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB059"/>
      <stop offset="55%" stop-color="#FF7A2F"/>
      <stop offset="100%" stop-color="#EC551C"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#EC551C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <text x="230" y="34" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#241C14">ShadowingMaster · 方案对比</text>

  <!-- v3: mic + echo arcs -->
  <g transform="translate(30,52)">
    <rect x="8" y="8" width="144" height="144" rx="38" fill="url(#warmTile)" filter="url(#soft)"/>
    <g>
      <rect x="61" y="34" width="38" height="54" rx="19" fill="#FFFFFF"/>
      <g stroke="#EC551C" stroke-opacity="0.5" stroke-width="2.4" stroke-linecap="round">
        <line x1="68" y1="48" x2="92" y2="48"/>
        <line x1="68" y1="58" x2="92" y2="58"/>
        <line x1="68" y1="68" x2="92" y2="68"/>
      </g>
      <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
        <path d="M60 90 L60 100 Q60 105 65 105 L95 105 Q100 105 100 100 L100 90"/>
        <line x1="80" y1="105" x2="80" y2="121"/>
        <line x1="66" y1="123" x2="94" y2="123"/>
      </g>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path d="M104 48 A12 12 0 0 1 104 72" stroke-width="6" opacity="0.85"/>
      <path d="M104 40 A20 20 0 0 1 104 80" stroke-width="6" opacity="0.5"/>
      <path d="M104 32 A28 28 0 0 1 104 88" stroke-width="6" opacity="0.28"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="132" cy="28" r="3" opacity="0.9"/>
      <circle cx="142" cy="46" r="2" opacity="0.7"/>
    </g>
  </g>

  <!-- v4: mic + shadow mic -->
  <g transform="translate(250,52)">
    <rect x="8" y="8" width="144" height="144" rx="38" fill="url(#warmTile)" filter="url(#soft)"/>
    <g opacity="0.24" fill="#FFFFFF">
      <rect x="70" y="42" width="38" height="54" rx="19"/>
      <path fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" d="M73 98 L73 108 Q73 113 78 113 L108 113 Q113 113 113 108 L113 98"/>
      <line x1="89" y1="113" x2="89" y2="129" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <line x1="75" y1="131" x2="103" y2="131" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="61" y="34" width="38" height="54" rx="19" fill="#FFFFFF"/>
      <g stroke="#EC551C" stroke-opacity="0.5" stroke-width="2.4" stroke-linecap="round">
        <line x1="68" y1="48" x2="92" y2="48"/>
        <line x1="68" y1="58" x2="92" y2="58"/>
        <line x1="68" y1="68" x2="92" y2="68"/>
      </g>
      <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
        <path d="M60 90 L60 100 Q60 105 65 105 L95 105 Q100 105 100 100 L100 90"/>
        <line x1="80" y1="105" x2="80" y2="121"/>
        <line x1="66" y1="123" x2="94" y2="123"/>
      </g>
    </g>
    <g fill="#FFFFFF">
      <circle cx="128" cy="30" r="3" opacity="0.9"/>
      <circle cx="139" cy="46" r="2" opacity="0.7"/>
    </g>
  </g>

  <text x="110" y="222" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#EC551C">v3 · 回声弧</text>
  <text x="330" y="222" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#EC551C">v4 · 影子话筒</text>
  <text x="230" y="252" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#888780">左：暗示「声音传出」　右：字面「影子跟练」</text>
</svg>
