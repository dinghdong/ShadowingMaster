<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="ShadowingMaster logo mark (echo bubble)">
  <defs>
    <linearGradient id="warmTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB059"/>
      <stop offset="55%" stop-color="#FF7A2F"/>
      <stop offset="100%" stop-color="#EC551C"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#EC551C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="144" height="144" rx="38" fill="url(#warmTile)" filter="url(#soft)"/>

  <!-- bubble composition, centered in tile (bbox center -> 80,80) -->
  <g transform="translate(11,3)">
    <!-- shadow bubble (echo of speech, offset down-right) -->
    <g opacity="0.22" fill="#FFFFFF" transform="translate(8,8)">
      <rect x="32" y="40" width="66" height="50" rx="18"/>
      <path d="M46 90 L46 106 L64 90 Z"/>
    </g>

    <!-- front bubble: speech bubble with sound-wave arcs -->
    <g>
      <rect x="32" y="40" width="66" height="50" rx="18" fill="#FFFFFF"/>
      <path d="M46 90 L46 106 L64 90 Z" fill="#FFFFFF"/>
      <g fill="none" stroke="#FF7A2F" stroke-width="4.5" stroke-linecap="round">
        <path d="M52 58 A 12 12 0 0 1 52 72"/>
        <path d="M60 53 A 20 20 0 0 1 60 77"/>
        <path d="M68 48 A 28 28 0 0 1 68 82"/>
      </g>
    </g>
  </g>

  <g fill="#FFFFFF">
    <circle cx="128" cy="30" r="3" opacity="0.9"/>
    <circle cx="139" cy="46" r="2" opacity="0.7"/>
  </g>
</svg>
