<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="ShadowingMaster logo mark (comet echo)">
  <defs>
    <linearGradient id="warmTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB059"/>
      <stop offset="55%" stop-color="#FF7A2F"/>
      <stop offset="100%" stop-color="#EC551C"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#EC551C" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="tailGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="144" height="144" rx="38" fill="url(#warmTile)" filter="url(#soft)"/>

  <!-- glowing comet tail (your echo trailing behind) -->
  <path d="M92 52 Q 64 80 38 106 Q 58 80 98 64 Z" fill="url(#tailGrad)"/>

  <!-- fading dot trail = the echo following -->
  <g fill="#FFFFFF">
    <circle cx="80" cy="72" r="14" opacity="0.52"/>
    <circle cx="68" cy="84" r="10.5" opacity="0.37"/>
    <circle cx="57" cy="94" r="7.5" opacity="0.26"/>
    <circle cx="48" cy="102" r="5" opacity="0.16"/>
    <circle cx="41" cy="108" r="3" opacity="0.10"/>
  </g>

  <!-- comet head (the original voice you follow) -->
  <circle cx="94" cy="56" r="23" fill="#FFFFFF"/>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <circle cx="130" cy="36" r="3" opacity="0.9"/>
    <circle cx="140" cy="50" r="2" opacity="0.7"/>
  </g>
</svg>
