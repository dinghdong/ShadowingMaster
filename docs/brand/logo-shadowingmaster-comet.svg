      <stop offset="0%" stop-color="#FFB059"/>
      <stop offset="55%" stop-color="#FF7A2F"/>
      <stop offset="100%" stop-color="#EC551C"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
