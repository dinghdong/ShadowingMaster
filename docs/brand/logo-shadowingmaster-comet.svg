  <text x="196" y="106" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-0.5" fill="#1A1A1A">Shadowing<tspan fill="url(#textGrad)">Master</tspan></text>
