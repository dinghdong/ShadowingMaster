<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" width="620" height="170" role="img" aria-label="ShadowingMaster (shadow mic, dark background)">
  <defs>
    <linearGradient id="warmTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB059"/>
      <stop offset="55%" stop-color="#FF7A2F"/>
      <stop offset="100%" stop-color="#EC551C"/>
    </linearGradient>
    <linearGradient id="warmText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB059"/>
      <stop offset="100%" stop-color="#FF7A2F"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g id="mark">
    <rect x="12" y="12" width="146" height="146" rx="38" fill="url(#warmTile)" filter="url(#soft)"/>

    <g opacity="0.24" fill="#FFFFFF">
      <rect x="74" y="42" width="38" height="54" rx="19"/>
      <path fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" d="M77 98 L77 108 Q77 113 82 113 L112 113 Q117 113 117 108 L117 98"/>
      <line x1="93" y1="113" x2="93" y2="129" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <line x1="79" y1="131" x2="107" y2="131" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    </g>

    <g>
      <rect x="65" y="34" width="38" height="54" rx="19" fill="#FFFFFF"/>
      <g stroke="#EC551C" stroke-opacity="0.5" stroke-width="2.4" stroke-linecap="round">
        <line x1="72" y1="52" x2="96" y2="52"/>
        <line x1="72" y1="62" x2="96" y2="62"/>
        <line x1="72" y1="72" x2="96" y2="72"/>
      </g>
      <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
        <path d="M64 94 L64 104 Q64 109 69 109 L99 109 Q104 109 104 104 L104 94"/>
        <line x1="84" y1="109" x2="84" y2="125"/>
        <line x1="70" y1="127" x2="98" y2="127"/>
      </g>
    </g>

    <g fill="#FFFFFF">
      <circle cx="132" cy="32" r="3" opacity="0.9"/>
      <circle cx="142" cy="50" r="2" opacity="0.7"/>
    </g>
  </g>

  <text x="188" y="107" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="48" font-weight="600" letter-spacing="-0.5">
    <tspan fill="#FFF1E6">Shadowing</tspan><tspan fill="url(#warmText)" font-weight="700">Master</tspan>
  </text>
</svg>
