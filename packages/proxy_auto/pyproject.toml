[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-auto"
version = "0.1.0"
description = "Zero-dependency outbound proxy auto-detection for crawlers/API clients (macOS scutil + standard env vars)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
py-modules = ["proxy_auto"]
